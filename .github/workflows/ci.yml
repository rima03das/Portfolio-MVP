name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL "$release/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          grep -F "  $archive" "$RUNNER_TEMP/gitleaks-checksums.txt" > "$RUNNER_TEMP/gitleaks.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check gitleaks.sha256)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan repository for secrets
        run: |
          gitleaks version
          gitleaks git --config .gitleaks.toml .
          gitleaks dir --config .gitleaks.toml .

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Run project checks
        run: npm run check

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
