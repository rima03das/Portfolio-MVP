spring.application.name=portfolio
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${PORTFOLIO_DB_URL:jdbc:h2:file:./data/portfolio;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${PORTFOLIO_DB_USER:sa}
spring.datasource.password=${PORTFOLIO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
app.data.reset=${PORTFOLIO_RESET:false}
